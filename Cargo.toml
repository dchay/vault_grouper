[package]
name    = "obsidian_vault_grouper"
version = "1.7.1"
edition = "2024"

[lib]
name = "obsidian_vault_grouper"
path = "src/lib.rs"

[[bin]]
name = "obsidian_vault_grouper"
path = "src/main.rs"

[dependencies]
anyhow       = "1"
clap         = { version = "4.5", features = ["derive"] }
globset      = "0.4"
indicatif    = "0.17"
sha2         = "0.10"
tempfile     = "3"
dunce = "1.0.5"
jwalk = "0.8.1"

[dev-dependencies]
tempfile     = "3"
