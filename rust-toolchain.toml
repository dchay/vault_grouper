[toolchain]
# Pin the exact Rust version your Rover project must use
channel = "1.98.0"

# Recommended developer components
components = [
    "rustfmt",
    "clippy",
    "rust-src"
]

# Common targets for cross‑platform builds
targets = [
    "x86_64-pc-windows-msvc"
]

# Ensure reproducible builds inside Rover containers
profile = "minimal"
